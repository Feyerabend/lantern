# Build Lantern and run its tests on Linux and macOS.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3
          echo "WASM_LD=$(command -v wasm-ld || ls /usr/bin/wasm-ld-* | sort -V | tail -1)" >> "$GITHUB_ENV"

      # Apple's clang on the runners has no WebAssembly target: use LLVM's;
      # wasm-ld comes with Homebrew's lld, apart from llvm
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "WASM_LD=$(brew --prefix lld)/bin/wasm-ld" >> "$GITHUB_ENV"

      - name: Build the browser version
        run: make CLANG="${CLANG:-clang}" WASM_LD="$WASM_LD"

      - name: Test
        run: make test CLANG="${CLANG:-clang}"
